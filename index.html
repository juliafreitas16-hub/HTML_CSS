<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!--O titulo é constituido pela tag h1 sendo a maior, recebendo destaque na página. 
Em seguido é usado a tag <form> para a entrada de dados, criando um formulário. 
A tag <label> é usada para criar uma rótulo ou descrição para o campo do formulário, já a tag <input type="text"> é usada para criar um campo de entrada de linha única fomando o campos "Nome completo".
É usado placeholder para exibir um texto temporário como sugestão, também é usado a tag <input> com o type email e recebe um id.O mesmo processo é usado para criar o campo de senha e telefone de emergência, mudando apenas o type e o id. 
A tag <input type="date"> foi usada para o usúario escolher a data de nascimento. 
O campo preferência recebe a tag h3 para o tamanho da fonte. 
Já o campo áreas de interesse recebe a tag h4 para o tamanho da fonte. 
As opçoes recebem a tag <input type="checkbox"> para o usuário poder escolher dentre varias opções. 
Para tornar as opções senha de acesso, email de acesso e telefone de emergência obrigatórios é usado o atributo required dentro da tag input, desta forma o formulário só podera ser enviado caso esse campos estejam prenchidos. 
O campo "como conheceu a escola é usado <input type="checkbox"> sendo possivel escolher dentre as opções oferecidas. 
Por fim é usada <button type="submit">Enviar</button> para gerar o botão para enviar o fomulário. 
Para criar o botão "Limpar" foi usado <button type="reset">Limpar</button> dando a opção de limpar todo o formulário.-->



    <h2>Matrícula - Escola online</h2>
    <p> </p>
    <fieldset>
        <legend>Dados pessoais </legend>
        <P> </P>
        <form>
            <header>
                <p> </p>
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" nome_completp="">

                <p> </p>

                <label for="nascimento">Data de nascimento</label>
                <input type="date" id="nascimento" name="Data de nascimento">
                <div>
                    <p> </p>

                    <label for="emaildoaluno"> E-mail do aluno</label>
                    <input type="email" id="emaildoaluno" name="E-mail do aluno" placeholder="aluno@exemplo.com"
                        required>


                    <p> </p>

                    <label for="senha"> Senha de acesso:</label>
                    <input type="senha" id="senhadeacesso" name="Senha de acesso:" placeholder="*********" required>


                    <p> </p>

                    <label for="telefone"> Telefone de Emergência</label>.
                    <input type="telefone" id="telefonedeemergencia" name="Telefone de Emergência:"
                        placeholder="(00)00000-0000" required>
                    <p>
                    <p>
    </fieldset>

    <fieldset>
        <legend>Preferência de Estudo</legend>

        <legend>Áreas de interesse:</legend>

        <input type="checkbox" id="front-end" name="fontend" value="front-end">
        <label for="Front-end">Front-end</label><br>
        <input type="checkbox" id="back-end" name="baclend" value="Back-end">
        <label for="Back-end">Back-end</label><br>
        <input type="checkbox" id="design" name="desihn" value="design">
        <label for="Design">Design</label><br>
        <input type="checkbox" id="dados" name="dados" value="dados">
        <label for="Dados">Dados</label><br>
        <div>
            <p>
            <p>

                <label for="como_conheceu">Como conheceu a escola?</label>
                <select id="como_conheceu" name="como_conheceu" required>
                    <option value=""> Selecione uma opção </option>
                    <option value="indicacao">Indicação</option>
                    <option value="google">Google</option>
                    <option value="redessociais">Redes sociais</option>
                </select>
    </fieldset>
    <p>
    <p>
        <button> Matricular </button>
        <button> Limpar </button>
</body>

</html>
